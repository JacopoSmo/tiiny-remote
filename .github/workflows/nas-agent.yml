name: NAS agent image

on:
  push:
    branches: [main, experimental]
    paths: ["nas-agent/**", ".github/workflows/nas-agent.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The automated checks first: an agent that fails them is never published.
      - name: Automated checks
        run: python3 -m unittest discover -s nas-agent -p "test_*.py" -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → :latest, experimental → :exp; for the NAS's CPU (x86) and ARM boards alike.
      - uses: docker/build-push-action@v6
        with:
          context: nas-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jacoposmo/tiiny-remote-agent:${{ github.ref_name == 'main' && 'latest' || 'exp' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
