name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mv app/build/outputs/apk/release/app-release.apk TiinyRemote-1.0.${{ github.run_number }}.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: TiinyRemote-apk
          path: TiinyRemote-*.apk

      - name: Publish it as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tiiny Remote 1.0.${{ github.run_number }}
          body: Download the .apk below on your phone and open it to install or update.
          files: TiinyRemote-*.apk
