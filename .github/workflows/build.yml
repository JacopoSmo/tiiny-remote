name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from the secrets (if set)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mv app/build/outputs/apk/release/app-release.apk TiinyRemote-2.0.${{ github.run_number }}.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: TiinyRemote-apk
          path: TiinyRemote-*.apk

      - name: Publish it as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tiiny Remote 2.0.${{ github.run_number }}
          body: Download the .apk below on your phone and open it to install or update.
          files: TiinyRemote-*.apk
