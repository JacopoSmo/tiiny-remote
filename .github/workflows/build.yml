name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from the secrets (if set)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The signing key isn't set up: add SIGNING_KEYSTORE_B64 and SIGNING_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      - name: Version number
        run: echo "APP_VERSION=5.0.$(( ${{ github.run_number }} - 175 ))" >> "$GITHUB_ENV"

      - name: Automated checks (the NAS agent, then the app); a failing check stops the release
        run: |
          python3 -m unittest discover -s nas-agent -p "test_*.py" -v
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build the APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mv app/build/outputs/apk/release/app-release.apk "TiinyRemote-$APP_VERSION.apk"

      - name: Publish it as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Tiiny Remote ${{ env.APP_VERSION }}
          make_latest: "true"
          body_path: RELEASE_NOTES.md
          files: TiinyRemote-*.apk
